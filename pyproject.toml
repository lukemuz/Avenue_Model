[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "avenue_model"
description = "Fast, defensible insurance models built directly from rating tables"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "Lucas Muzynoski" },
]
keywords = ["actuarial", "glm", "insurance", "lightgbm", "rating-tables"]
dependencies = [
    "polars==1.31.0",
    "pyarrow>=14.0.1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/lukemuz/Avenue_Model"
Repository = "https://github.com/lukemuz/Avenue_Model"
Issues = "https://github.com/lukemuz/Avenue_Model/issues"

[project.optional-dependencies]
# `avenue_model.tune_lgbm` and the LightGBM examples. Kept optional because the core
# package is a GLM engine and most users of it never touch a booster.
tuning = [
    "lightgbm>=4.0",
    "optuna>=3.0",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "avenue_model.avenue_model"
