name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run Rust tests
        run: cargo test --no-default-features
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - name: Install wheel
        # With the `tuning` extra, so the converted-model tests actually run rather
        # than skipping: a skipped test is not a passing one.
        run: python -m pip install "$(echo dist/*.whl)[tuning,test]"
      - name: Verify wheel and run tests and examples
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path('dist').glob('*.whl'))
          subprocess.check_call([sys.executable, 'studies/wheel_acceptance.py',
                                 '--wheel', str(wheel), '--output', '/tmp/avenue-wheel-acceptance'])
