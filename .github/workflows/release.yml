name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-15-intel
            target: x86_64
          - os: macos-latest
            target: aarch64
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2)"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  test-wheels:
    name: Test wheel (${{ matrix.platform.os }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
        platform:
          - os: ubuntu-latest
            artifact: wheel-ubuntu-latest-x86_64
          - os: ubuntu-24.04-arm
            artifact: wheel-ubuntu-latest-aarch64
          - os: windows-latest
            artifact: wheel-windows-latest-x64
          - os: macos-15-intel
            artifact: wheel-macos-15-intel-x86_64
          - os: macos-latest
            artifact: wheel-macos-latest-aarch64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform.artifact }}
          path: dist
      - name: Install LightGBM OpenMP runtime on macOS
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install the built wheel and test dependencies
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', str(wheels[0]) + '[test,tuning,credibility]'])
      - name: Verify installed payload, tests and tutorials
        shell: python
        run: |
          from pathlib import Path
          import subprocess, sys
          wheel = next(Path('dist').glob('*.whl'))
          subprocess.check_call([sys.executable, 'studies/wheel_acceptance.py', '--wheel', str(wheel), '--output', 'wheel-acceptance'])
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: acceptance-${{ matrix.platform.os }}-${{ matrix.python }}
          path: wheel-acceptance/
          if-no-files-found: warn

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, test-wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/avenue-model
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
